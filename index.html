<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library</title>
<style>
:root{--text:#f2f2f2;--radius:12px;--min:180px;--font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--as-btn:11px;--as-chip:11px;--as-sw:20px;--as-pad:3px 8px;--as-face:200px}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--font);min-height:100vh}
#bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center}
#dim{position:fixed;inset:0;z-index:-1;background:#000}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:18px 24px;background:rgba(0,0,0,var(--hbg,.45));backdrop-filter:blur(10px)}
.hdr-left{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.ver{font-size:11px;opacity:.55;letter-spacing:.04em}
#libSearch{width:min(240px,42vw);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);color:inherit;font:inherit;font-size:13px}
#libSearch::placeholder{opacity:.55}
#searchHits{position:absolute;z-index:12;top:100%;left:0;margin-top:4px;width:min(320px,90vw);max-height:50vh;overflow:auto;background:rgba(18,20,26,.97);border:1px solid #444;border-radius:10px;padding:6px;display:none}
#searchHits.on{display:block}
#searchHits button{display:block;width:100%;text-align:left;margin:2px 0;font-size:13px}
.as-switch button{font-size:var(--as-btn)!important;padding:var(--as-pad)!important}
.as-switch button img{width:var(--as-sw)!important;height:var(--as-sw)!important}
.chips button{font-size:var(--as-chip)!important;padding:var(--as-pad)!important}
.asb .row button{font-size:var(--as-btn)!important;padding:var(--as-pad)!important}
.asb>img,.asb img:first-child{width:var(--as-face)!important;height:var(--as-face)!important}
.brand{text-align:center}
#tools{justify-self:end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
header h1{margin:0;font-size:calc(clamp(26px,4vw,40px)*var(--hts,1));line-height:1.1}
body.nosur .sur,body.norec .rcw{display:none}
button{font:inherit;color:inherit;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.25)}
button.pri{background:#3b6cf6;border-color:#3b6cf6}
#status{font-size:13px;opacity:.8}
main{padding:20px 24px 80px;max-width:var(--mw,1500px);margin:auto;flex:1;min-width:0}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.card{border-radius:var(--radius);overflow:hidden;cursor:pointer;background:rgba(0,0,0,.4);border:2px solid var(--ac);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .cv{aspect-ratio:4/3;background:#222 center/cover}
.card div.t{padding:8px 10px;font-size:14px}.card small{opacity:.7;display:block}
.sec{margin:0 0 28px;padding:18px;border-radius:calc(var(--radius) + 4px);border-left:6px solid var(--ac);background-color:rgba(0,0,0,.35);background-size:cover;background-position:center}
.sec h2{margin:0;font-size:22px;color:var(--ac);filter:brightness(1.3);display:inline}
.sec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.sec .path{font-size:12px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min),1fr));gap:8px}
figure{margin:0;position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:#222;cursor:pointer}
figure img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
figure:hover img{transform:scale(1.06)}
.play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);border-radius:20px;padding:2px 8px;font-size:12px}
.more{margin-top:12px}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;gap:14px;align-items:center;cursor:pointer;padding:6px;border-radius:var(--radius)}
.vrow:hover{background:rgba(255,255,255,.1)}
.vrow img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#222;flex:none}
.vrow span{font-size:15px;word-break:break-word}
.edit-only{display:none}body.edit .edit-only{display:inline-block}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb .stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#lb img,#lb iframe{max-width:100%;max-height:100%;border:0}
#lb iframe{width:min(1100px,100%);height:100%}
#lb .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:10px;font-size:14px;align-items:center}
.nav{position:absolute;top:50%;font-size:28px;padding:10px 16px}
#panel{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:100%;z-index:15;background:rgba(18,20,26,.97);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .2s;border-left:1px solid #333}
#panel.on{transform:none}
#panel h3{margin:0 0 12px}
#panel label{display:block;margin:12px 0 4px;font-size:13px;opacity:.85}
#panel input[type=text],#panel select{width:100%;padding:7px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;font:inherit}
#panel input[type=range]{width:100%}#panel input[type=color]{width:60px;height:34px;border:0;background:none}
#panel .row{display:flex;gap:6px;align-items:center}
#panel p.h{font-size:12px;opacity:.65}
.empty{text-align:center;padding:80px 20px;max-width:620px;margin:auto}
.empty p{opacity:.85;line-height:1.5}
dialog{background:#1b1e26;color:#eee;border:1px solid #444;border-radius:12px;max-width:620px;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog li{margin:6px 0;line-height:1.45}dialog code{background:#000;padding:1px 5px;border-radius:4px}
dialog input{width:100%;padding:8px;margin:10px 0;border-radius:6px;border:1px solid #555;background:#111;color:#fff}
.sur{display:block;font-size:12px;opacity:.85;margin-top:3px}
.sur select{background:transparent;color:inherit;border:0;border-bottom:1px dashed currentColor;font:inherit;font-size:12px;cursor:pointer}
.sur option{background:#1b1e26;color:#eee}
h2.rl{margin:0 0 10px;font-size:18px}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.slot{aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;position:relative;background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.2);display:grid;place-items:center;font-size:13px;opacity:.9}
.slot.f{border:2px solid rgba(255,255,255,.2);cursor:pointer;opacity:1}
.slot img{width:100%;height:100%;object-fit:cover;filter:brightness(var(--rb,.5));transition:filter .15s}
.slot.f:hover img{filter:brightness(var(--rbh,.75))}
.slot span.n{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .hd{cursor:pointer}.tg{width:18px;display:inline-block}
.sec.collapsed .bd{display:none}.sec.collapsed .hd{margin-bottom:0}
.lay{display:flex;gap:18px;align-items:flex-start}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min),1fr));gap:var(--gap,16px);flex:1;min-width:0}
.lay.open .fl{flex:0 0 calc(var(--min)*1.9);grid-template-columns:repeat(2,1fr);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:2px}
.tile{cursor:pointer;border-radius:var(--radius);overflow:hidden;background:rgba(0,0,0,.4);border:var(--bw,2px) solid var(--ac);display:flex;flex-direction:column}
.tile:hover{transform:translateY(var(--lift,-3px))}.tile.sel{box-shadow:0 0 0 3px var(--ac)}
.tile .cv{aspect-ratio:var(--tar,3/4);background:#222 center/cover;display:grid;place-items:center;font-size:13px;opacity:.95}
.tile .nm{padding:10px 12px;font-size:calc(15px*var(--cts,1));word-break:break-word}.tile small{display:block;opacity:.7}
.pn{display:none;flex:1;min-width:0;position:sticky;top:12px;height:calc(100vh - 24px);flex-direction:column;border-radius:calc(var(--radius) + 4px);border-left:6px solid var(--ac);background:rgba(0,0,0,var(--pdim,.45)) center/cover;overflow:hidden}
.lay.open .pn{display:flex}
.ph{display:flex;gap:10px;align-items:baseline;padding:14px 16px;background:rgba(0,0,0,.35)}
.ph h2{margin:0;font-size:22px;color:var(--ac);filter:brightness(1.3)}.ph .path{flex:1;font-size:13px;opacity:.7}
.pl{overflow:auto;flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.frow{display:flex;gap:14px;align-items:center;cursor:pointer;padding:6px;border-radius:var(--radius)}
.frow:hover{background:rgba(255,255,255,.1)}
.frow img{width:calc(var(--min)*.61);height:calc(var(--min)*.39);object-fit:cover;border-radius:6px;background:#222;flex:none}
.frow span{flex:1;font-size:15px;word-break:break-word}.frow small{display:block;opacity:.65;font-size:12px}.vb{font-size:12px;opacity:.8}
@media(max-width:760px){header{grid-template-columns:1fr;text-align:center}.brand{order:-1}#tools{justify-self:center}
.lay{flex-direction:column}.lay.open .fl{flex:none;width:100%;position:static;max-height:none;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.pn{position:static;height:70vh;width:100%}.recent{gap:6px}}
.cat{position:relative;height:calc(clamp(120px,18vw,220px)*var(--bhs,1));border-radius:calc(var(--radius) + 4px);overflow:hidden;cursor:pointer;margin:0 0 14px;background:#222 center/cover;display:grid;place-items:center;border:var(--bw,2px) solid var(--ac)}
.cat::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--bdim,.42))}
.cat.sel{box-shadow:0 0 0 3px var(--ac)}
.cat h2{position:relative;margin:0;color:#fff;font-size:calc(clamp(26px,5vw,52px)*var(--bsc,1));font-weight:800;text-align:center;padding:0 16px;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.cat .edit-only{position:absolute;top:10px;right:10px;z-index:1}
.lay{margin-bottom:28px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--min)*3),1fr));gap:var(--gap,16px);margin-bottom:18px}
.cc{cursor:pointer;border-radius:var(--radius);overflow:hidden;background:rgba(0,0,0,.4);border:var(--bw,2px) solid var(--ac)}
.cc:hover{transform:translateY(var(--lift,-3px))}.cc.sel{box-shadow:0 0 0 3px var(--ac)}
.cc .cv{aspect-ratio:var(--car,16/9);background:#222 center/cover;display:grid;place-items:center;font-size:13px}
.cc .nm{padding:10px 14px;font-size:calc(20px*var(--cts,1));font-weight:700;word-break:break-word}.cc small{display:block;font-weight:400;font-size:13px;opacity:.7}
.xp{margin:0 0 20px;padding-left:14px;border-left:3px solid rgba(255,255,255,.2)}
.ptop{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.ptop h2{margin:0;font-size:clamp(24px,4vw,40px);flex:1}
.lay.open>.pn:only-child{height:calc(100vh - 100px)}
#vdim{position:fixed;inset:0;z-index:-1;background:#000;opacity:0;pointer-events:none}
.vw{display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 190px)}
.vw .ptop{margin:0}
.vw:fullscreen{background:var(--vfs,#000);gap:0;min-height:100vh;padding:0}
.vw:fullscreen .ptop,.vw:fullscreen .vset{display:none}
.vstage{position:relative;flex:1;min-height:55vh;overflow:hidden;border-radius:var(--vrad,8px)}
.vstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--vfit,contain);border-radius:var(--vrad,8px);user-select:none}
.vw:fullscreen .vstage,.vw:fullscreen .vstage img{border-radius:0}
.varr{position:absolute;top:50%;transform:translateY(-50%);width:var(--vasz,56px);height:var(--vasz,56px);padding:0;border-radius:50%;background:rgba(0,0,0,.45);color:var(--vacol,#fff);border:1px solid rgba(255,255,255,.25);font-size:calc(var(--vasz,56px)*.62);line-height:1;cursor:pointer;z-index:2;opacity:var(--vao,1);transition:opacity .15s}
.vstage:hover .varr{opacity:1}
.vbar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.vcap{text-align:center;font-size:14px;opacity:.85;padding:2px 8px}
.vstrip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px}
.vstrip img{height:calc(var(--min)*.36);aspect-ratio:1;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer;flex:none}
.vstrip img.on{opacity:1;outline:2px solid var(--text)}
@media(max-width:760px){.cg{grid-template-columns:1fr 1fr}}
#shell{display:flex;align-items:flex-start}
#side{flex:none;width:var(--sbw,280px);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 8px 40px;background:rgba(0,0,0,var(--hbg,.45));backdrop-filter:blur(10px)}
#side h3{margin:0 6px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
body.nosb #side{display:none}
.sr{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:14px}
.sr:hover{background:rgba(255,255,255,.1)}.sr.cur{background:rgba(255,255,255,.2)}
.sr .sc{width:16px;flex:none;text-align:center;opacity:.8}.sr .sl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr small{opacity:.55}.sr.sf{font-size:13px;opacity:.85}
.mb{position:relative;height:calc(clamp(120px,18vw,220px)*var(--bhs,1)*.6);width:var(--mbw,80%);margin:0 auto 14px;border-radius:calc(var(--radius) + 2px);overflow:hidden;cursor:pointer;background:#222 center/cover;display:grid;place-items:center;border:var(--bw,2px) solid var(--ac)}
.mb::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--bdim,.42))}
.mb:hover{transform:translateY(var(--lift,-3px))}.mb.sel{box-shadow:0 0 0 3px var(--ac)}
.mb h3{position:relative;margin:0;font-size:calc(clamp(20px,3.4vw,34px)*var(--bsc,1));font-weight:800;text-align:center;padding:0 12px;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.mb small{display:block;font-size:13px;font-weight:400;opacity:.85}
.mb .edit-only{position:absolute;top:8px;right:8px;z-index:1}
#lb video{width:100%;max-height:100%;background:#000;outline:0}
.vbox{display:grid;place-items:center;width:min(1100px,100%);height:100%}
.vbox iframe{width:100%;height:100%}
.vmsg{max-width:460px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px;background:rgba(0,0,0,.6);border-radius:12px}
#title{cursor:pointer}
@media(max-width:900px){#side{position:fixed;left:0;top:0;z-index:30;width:min(300px,86vw);background:rgba(14,14,20,.97)}.mb{width:94%}}
#asst{position:fixed;right:20px;bottom:20px;z-index:25;width:64px;height:64px;border-radius:50%;padding:0;border:3px solid #ff6b9d;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.55);cursor:pointer;background:linear-gradient(145deg,#2a1a24,#1a1218);display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
#asst:hover{transform:scale(1.1);box-shadow:0 8px 28px rgba(255,107,157,.4)}
#asst svg{width:32px;height:32px;display:block}
body.onasst #asst{display:none}
.as{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.asb{text-align:center;position:sticky;top:12px}.asb h3{margin:10px 0 0}
.asb img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid #ff7ab8;box-shadow:0 0 30px rgba(255,122,184,.45);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.asb img{animation:none}}
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;border-radius:16px;background:rgba(0,0,0,.4);overflow:hidden}
#chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:92%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg>img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.bub{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.12);white-space:pre-wrap}.me .bub{background:#c2417d}
.rec{display:flex;gap:12px;margin-top:10px;padding:8px;border-radius:12px;background:rgba(0,0,0,.35)}
.rec img{width:120px;height:90px;object-fit:cover;border-radius:8px;flex:none;background:#222}
.rec b{display:block}.rec p{margin:4px 0;font-size:13px;opacity:.9}.rec .row{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.12)}
.chat input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:inherit;font:inherit}
@media(max-width:760px){.as{grid-template-columns:1fr}.asb img{width:110px;height:110px}.asb{position:static}.rec img{width:90px;height:70px}}

.as-switch{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;grid-column:1/-1;align-items:center}
.as-switch button{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:14px;border:1.5px solid transparent;background:rgba(255,255,255,.1);font-size:11px;cursor:pointer;line-height:1.2}
.as-switch button img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.as-switch button.on{border-color:var(--c,#ff7ab8);background:rgba(255,255,255,.2)}
.asb .row button{padding:4px 8px;font-size:11px;border-radius:6px}
.chips{gap:4px;padding:6px 8px}
.chips button{padding:4px 8px;font-size:11px;border-radius:6px}
.sat-wrap{margin-top:8px;text-align:left}
.sat-track{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:3px}
.sat-fill{height:100%;width:35%;background:#ff7ab8;border-radius:4px;transition:width .4s ease,background .3s}
.msg .who{font-size:11px;opacity:.65;margin-bottom:2px}
.react-strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.react-strip img{height:56px;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.85;flex:none}
.react-strip img:hover{opacity:1;outline:2px solid var(--ac,#ff7ab8)}
.heart-float{position:fixed;font-size:22px;pointer-events:none;animation:floatUp 1.5s ease-out forwards;z-index:40}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.4)}}
.asb.happy img{animation:happyBob .6s ease}
@keyframes happyBob{0%,100%{transform:scale(1)}40%{transform:scale(1.12) rotate(-4deg)}70%{transform:scale(1.08) rotate(3deg)}}
.as{border:3px solid var(--ac,#ff7ab8);border-radius:18px;padding:16px;background:rgba(0,0,0,.45)}
.asb img{border-color:var(--ac,#ff7ab8)!important;box-shadow:0 0 30px color-mix(in srgb,var(--ac,#ff7ab8) 45%,transparent)!important}

</style>
</head>
<body>
<div id="bg"></div><div id="dim"></div><div id="vdim"></div><button id="asst" title="Chat with your AI assistants" aria-label="Open AI assistants"></button>
<header>
  <div class="hdr-left">
    <div class="ver">Library · V10.7</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:relative">
      <button id="sbt" title="Show or hide the folder list">☰ Folders</button>
      <input id="libSearch" type="search" placeholder="Search library…" autocomplete="off">
      <div id="searchHits"></div>
      <span id="status"></span>
    </div>
  </div>
  <div class="brand"><h1 id="title"><a id="home" href="#/" title="Back to the home page" style="color:inherit;text-decoration:none">My Library</a></h1>
    <label class="sur">surprise me <select id="sur"></select></label></div>
  <span id="tools"></span>
</header>
<div id="shell"><nav id="side" aria-label="Folders"></nav><main id="app"></main></div>
<aside id="panel"></aside>
<div id="lb"></div>
<dialog id="setup"></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e[a]=v;else e.setAttribute(a,v)}e.append(...k.flat().filter(x=>x!=null&&x!==false));return e};
const KEY='drivelib.v1';
const FONTS={system:'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace',rounded:'"Trebuchet MS","Segoe UI",sans-serif',elegant:'"Palatino Linotype",Palatino,serif'};

/* ---------- Drive ---------- */
async function api(path,params){const u=new URL('https://www.googleapis.com/drive/v3/'+path);for(const[k,v]of Object.entries(params))if(v)u.searchParams.set(k,v);
  const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function listAll(q,fields){let out=[],pt='';do{const d=await api('files',{q,fields:`nextPageToken,files(${fields})`,pageSize:1000,pageToken:pt});out.push(...d.files);pt=d.nextPageToken;status('Loaded '+out.length+'…')}while(pt);return out}
const status=t=>$('#status').textContent=t||'';
function connect(){
  if(!S.cid)return openSetup();
  if(!window.google){return alert('Google sign-in script has not loaded (check your internet connection).')}
  tc=tc||google.accounts.oauth2.initTokenClient({client_id:S.cid,scope:'https://www.googleapis.com/auth/drive.readonly',callback:async r=>{
    if(r.error)return alert('Sign-in failed: '+r.error);setTok(r);owner=true;await sync()}});
  tc.requestAccessToken();
}
async function sync(){
  try{
    status('Reading your Drive…');
    const root=(await api('files/root',{fields:'id'})).id;
    const fo=await listAll("mimeType='application/vnd.google-apps.folder' and trashed=false",'id,name,parents');
    const me=await listAll("(mimeType contains 'image/' or mimeType contains 'video/') and trashed=false",'id,name,mimeType,parents,thumbnailLink,createdTime');
    const cand=fo.filter(f=>f.name.trim().toLowerCase()==='delta');
    if(!cand.length)throw new Error('No folder named “DELTA” was found in your Drive.');
    const dl=cand.find(f=>(f.parents||[])[0]===root)||cand[0];
    const keep=new Set([dl.id]);let ch=true;
    while(ch){ch=false;fo.forEach(f=>{if(!keep.has(f.id)&&keep.has((f.parents||[])[0])){keep.add(f.id);ch=true}})}
    const fo2=fo.filter(f=>keep.has(f.id)),me2=me.filter(m=>keep.has((m.parents||[])[0]));
    S.lib={root,delta:dl.id,folders:fo2.map(f=>({id:f.id,n:f.name,p:(f.parents||[])[0]||''})),media:me2.map(m=>({id:m.id,n:m.name,m:m.mimeType,p:(m.parents||[])[0]||'',t:m.thumbnailLink||'',c:m.createdTime||''}))};
    save();status('Synced '+me2.length+' items');render();
  }catch(e){status('');alert('Could not read Drive:\n'+e.message)}
}

/* ---------- Data helpers ---------- */
let subOf={},bpick={},nodeOf={},GS=[];
function groups(){
  GS=[];const L=S.lib;if(!L)return[];byId={};subOf={};nodeOf={};
  const D=L.delta||(L.folders.find(f=>f.n.trim().toLowerCase()==='delta')||{}).id;
  if(!D)return[];
  const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
  const nw=a=>a.reduce((t,m)=>(m.c||'')>t?m.c:t,'');
  const ch={},ms={};
  L.folders.forEach(f=>(ch[f.p]=ch[f.p]||[]).push(f));
  L.media.forEach(m=>{byId[m.id]=m;(ms[m.p]=ms[m.p]||[]).push(m)});
  const s=S.theme.sort;
  const cmp=(a,b)=>s==='count'?b.all.length-a.all.length:s==='new'?b.newest.localeCompare(a.newest):nat(a.name,b.name);
  const leaf=(id,name,items)=>{const it=items.slice().sort((a,b)=>nat(a.n,b.n));return{id,name,items:it,kids:[],all:it,newest:nw(it)}};
  // A folder with subfolders is a "container"; a folder with no subfolders is a "leaf" (shows its files).
  const build=(id,name,top,depth)=>{
    const n={id,name,items:[],kids:[],all:[]};
    if(depth<30)(ch[id]||[]).forEach(f=>{if(edit||!F(f.id).hide){const k=build(f.id,f.n,false,depth+1);n.kids.push(k);n.all.push(...k.all)}});
    const direct=ms[id]||[];
    if(direct.length){
      if(!n.kids.length&&!top){const l=leaf(id,name,direct);n.items=l.items;n.all=l.all;direct.forEach(m=>nodeOf[m.id]=id)}
      else{const l=leaf('__l'+id,'Loose files',direct);l.label=name;direct.forEach(m=>nodeOf[m.id]='__l'+id);n.kids.push(l);n.all.push(...direct)}
    }
    n.kids.sort(cmp);n.newest=nw(n.all);return n;
  };
  const arr=(ch[D]||[]).filter(f=>edit||!F(f.id).hide).map(f=>build(f.id,f.n,true,0));
  if((ms[D]||[]).length){const l=leaf('__k','Files',ms[D]);l.label='Other files';ms[D].forEach(m=>nodeOf[m.id]='__k');arr.push({id:'__d',name:'Other files',items:[],kids:[l],all:l.all,newest:l.newest})}
  arr.sort((a,b)=>nat(a.name,b.name));
  GS=arr;return arr;
}
const coverSrc=g=>{const f=F(g.id);if(f.coverImg)return f.coverImg;if(f.coverId&&byId[f.coverId])return thumb(byId[f.coverId],600);
  const m=g.items.find(x=>!isVid(x))||g.items[0];return m?(S.vthumbs[m.id]||thumb(m,600)):''};
// random image from anywhere inside a folder (banners and half-width cards)
function randSrc(c,size){
  const f=F(c.id);if(f.coverImg)return f.coverImg;if(f.coverId&&byId[f.coverId])return thumb(byId[f.coverId],size);
  if(!c.all.length)return'';
  let m=bpick[c.id]&&byId[bpick[c.id]];
  if(!m||!c.all.includes(m)){const ph=c.all.filter(x=>!isVid(x)),p=ph.length?ph:c.all;m=p[Math.floor(Math.random()*p.length)];bpick[c.id]=m.id}
  return S.vthumbs[m.id]||thumb(m,size);
}
const bgOf=o=>o.bgImg||(o.bgId&&byId[o.bgId]?thumb(byId[o.bgId],1600):'');

function expand(node,d,top){

  const sel=path[d+1],cs=node.kids.filter(isC),ls=node.kids.filter(k=>!isC(k));

    w.append(el('div',{class:'lay'+(ol?' open':'')},el('div',{class:'fl'},ls.map(l=>tile(l,d+1))),ol?panel(ol,d+1):null))}

function runLibSearch(q){
  const box = $('#searchHits');
  if(!box) return;
  q = (q||'').trim().toLowerCase();
  if(!q || !S.lib){ box.className=''; box.innerHTML=''; return; }
  const hits = [];
  const roots = (typeof GS!=='undefined' && GS && GS.length) ? GS : (typeof groups==='function' ? groups() : []);
  const walk = (n, trail) => {
    const nm = F(n.id).name || n.name || '';
    const path = trail.concat(nm);
    if(nm.toLowerCase().includes(q)) hits.push({type:'folder', id:n.id, label:path.join(' › ')});
    (n.items||[]).forEach((m,i) => {
      if((m.n||'').toLowerCase().includes(q)) hits.push({type:'file', node:n, i, m, label:path.join(' › ')+' / '+m.n});
    });
    (n.kids||[]).forEach(k => walk(k, path));
  };
  roots.forEach(n => walk(n, []));
  box.innerHTML = '';
  hits.slice(0,40).forEach(h => {
    box.append(el('button', {onclick: () => {
      box.className='';
      const inp=$('#libSearch'); if(inp) inp.value='';
      if(h.type==='folder') goto(h.id);
      else openLb(h.node, h.i);
    }}, (h.type==='folder'?'📁 ':'📄 ') + h.label));
  });
  if(!hits.length) box.append(el('p', {class:'h', style:'margin:6px'}, 'No matches'));
  box.className = 'on';
}
document.addEventListener('input', e => { if(e.target && e.target.id==='libSearch') runLibSearch(e.target.value); });
document.addEventListener('click', e => {
  const box=$('#searchHits'); if(!box) return;

function loadAssistants(){
  try{
    const raw = localStorage.getItem(ASSISTANTS_KEY);
    if(raw){
      const list = JSON.parse(raw);
      if(Array.isArray(list) && list.length){
        const mapped = list.map(normalizeAss);
        const have = new Set(mapped.map(a => a.id));
        DEFAULT_ASSISTANTS.forEach(d => {
          if(!have.has(d.id)) mapped.push(normalizeAss({...d, greets:[...(d.greets||[])]}));
        });
        return mapped;
      }
    }
  }catch{}
  return DEFAULT_ASSISTANTS.map(a => normalizeAss({...a, greets:[...(a.greets||[])]}));
}
function normalizeAss(a){
  return {
    id: a.id || ('a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    name: (a.name||'Assistant').slice(0,40),
    color: a.color || '#ff6b9d',
    role: a.role || 'Your assistant',
    personality: a.personality || 'Helpful, eager, conversational. Recommends files and chats in character.',
    traits: a.traits || 'eager,chatty',
    greets: (Array.isArray(a.greets) && a.greets.length ? a.greets : ['Hey. What do you need?']).map(g => String(g).slice(0,400)),
    avatarFile: a.avatarFile || ''
  };
}

function asIndex(){
  const out=[];
  const walk=(n,tr)=>{
    const t=(n.id[0]==='_')?tr:[...tr,F(n.id).name||n.name];
    n.items.forEach((m,i)=>out.push({m,node:n,i,trail:t}));
    n.kids.forEach(k=>walk(k,t));
  };
  (GS||[]).forEach(n=>walk(n,[]));
  return out;
}

  // Identity
  if(/\b(who are you|your name|what can you do|what are you|help me|help\b)\b/.test(t) && !/\b(video|photo|folder|file|surprise|more)\b/.test(t)){
    return {text: flavor(`I’m ${a.name} — ${a.role}. ${a.personality} I can recommend files from your library, send pictures marked as me, tweak how I talk, and chat. Ask for files or just talk.`)};
  }

  // Greetings
  if(/^(hi|hey|hello|yo|sup|good morning|good night|how are you|how’re you|how r u)\b/.test(t) || (t.length < 12 && /\b(hi|hey|hello)\b/.test(t))){
    return {text: flavor(voiceLine('greet'))};
  }

  // Compliments
  if(/\b(you('re| are) (so )?(hot|sexy|beautiful|pretty|cute|good|perfect|amazing)|i love you|miss you|good (girl|slut|whore|assistant))\b/.test(t)){
    sat[a.id] = Math.min(100, sat[a.id] + 10);
    saveSat();
    return {text: flavor(voiceLine('praise'))};
  }

  // Dirty talk
  if(/\b(talk dirty|be dirty|say something (sexy|dirty|filthy)|dirty talk|tell me what you('d| would) do)\b/.test(t)){
    sat[a.id] = Math.min(100, sat[a.id] + 8);
    saveSat();
    return {text: flavor(voiceLine('dirty'))};
  }

  // Feeling / status
  if(/\b(how are you feeling|how do you feel|are you (ok|okay|horny|wet|ready)|status)\b/.test(t)){
    const feel = level > 80 ? "Wound up and focused on you." :
                 level > 55 ? "Engaged and ready." :
                 "Steady. Ready when you are.";
    return {text: flavor(feel + ' What do you want next?')};
  }

  if(/^(thanks|thank you|thx|ty)\b/.test(t)){
    return {text: flavor(pick([`Anytime.`,`Happy to. What else?`,`Of course.`]))};
  }

  if(/^(bye|goodbye|see you|later|gotta go|good night)\b/.test(t)){
    return {text: flavor(voiceLine('bye'))};
  }

  // Library overview
  if(/\b(what (do you have|can you find|is in|files|folders)|list (folders|files)|how many)\b/.test(t)){
    const folders = (GS||[]).slice(0,8).map(n => F(n.id).name || n.name).filter(Boolean);
    const count = asIndex().length;
    return {text: flavor(`I can see about ${count} files. Folders I notice: ${folders.join(', ') || 'none loaded yet'}. Name one, or say surprise me / videos / photos.`)};
  }

  // Reflective fallback for non-file chat
  if(t.length > 0 && !/\b(video|photo|pic|image|folder|file|surprise|more|newest|latest|old)\b/.test(t)){
    sat[a.id] = Math.min(100, sat[a.id] + 2);
    saveSat();
    const hooks = [
      `I heard you: “${raw.slice(0,100)}${raw.length>100?'…':''}”. Want files related to that, more talk, or something else?`,
      `Okay. I can dig the library, keep chatting in character, or send a picture of myself. Which?`,
      `Noted. If that was an order, say it clearer. If you want media, name a type or folder.`,
      `I’m with you. ${a.personality.split('.')[0]}. What should I do with that?`
    ];
    return {text: flavor(pick(hooks))};
  }

  // File recommendations
  const idx = asIndex();
  let pool, off = 0, noMatch = false;
  const more = /\b(more|another|again|next|else)\b/.test(t) && asLast;
  if(more){ pool = asLast.pool; off = asLast.off; }
  else {
    const vid = /video|clip|movie|watch/.test(t), ph = /photo|pic|image/.test(t);
    pool = idx.filter(e => vid && !ph ? isVid(e.m) : ph && !vid ? !isVid(e.m) : true);
    const words = t.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
    if(words.length){
      const sc = pool.map(e => {
        const nm = e.m.n.toLowerCase(), tr = e.trail.join(' ').toLowerCase();
        return {e, s: words.reduce((acc,w) => acc + (nm.includes(w)?3:0) + (tr.includes(w)?2:0), 0)};
      }).filter(x => x.s > 0);
      if(sc.length) pool = sc.sort((a,b) => b.s - a.s || (b.e.m.c||'').localeCompare(a.e.m.c||'')).map(x => x.e);
      else { noMatch = true; pool = shuf(pool); }
    } else if(/new|latest|recent|fresh/.test(t)) pool = pool.slice().sort((a,b) => (b.m.c||'').localeCompare(a.m.c||''));
    else if(/\bold|oldest|first|classic/.test(t)) pool = pool.slice().sort((a,b) => (a.m.c||'').localeCompare(b.m.c||''));
    else pool = shuf(pool);
    const fresh = pool.filter(e => !asSeen.has(e.m.id));
    if(fresh.length >= 3) pool = fresh;
  }
  const recs = pool.slice(off, off + 3);
  if(!recs.length) return {text: flavor(`That’s all I have for that. Ask differently, or talk to me.`)};
  asLast = {pool, off: off + recs.length};
  recs.forEach(e => asSeen.add(e.m.id));
  if(recs[0]) lastShared = recs[0];
  sat[a.id] = Math.min(100, sat[a.id] + 6);
  saveSat();
  const base = flavor(noMatch ? pick(NOMATCH) : pick(INTRO));
  const chimed = groupChime('files');
  return {
    text: mentionOthers(base),
    recs,
    after: flavor(pick(OUTRO)),
    extra: chimed
  };
}

  applyAsSize();
  const app = $('#app');
  app.innerHTML = '';
  if(!chat.length) chat.push({who:'her', text: pick(currentAss.greets || ['Hey.'])});

  const input = el('input', {type:'text', placeholder:'Talk, order files, tweak personality…', autocomplete:'off'});
  const send = txt => {
    txt = (txt||'').trim();
    if(!txt) return;
    input.value = '';
    chat.push({who:'me', text:txt}, {who:'her', typing:true});
    renderChat();
    setTimeout(() => {
      chat.pop();
      const rep = asReply(txt);
      const extra = rep.extra || [];
      delete rep.extra;
      chat.push({who:'her', ...rep});
      extra.forEach(x => chat.push(x));
      renderChat();
      updateSatBar();
    }, 400 + Math.random()*350);
  };

  const chips = ['Surprise me','Videos / photos','More','Watch with me','React to this','Pic of you','Talk dirty','@ others'];
  if(typeof GS !== 'undefined' && GS.length) chips.push('From ' + (F(GS[0].id).name || GS[0].name));

        openPanel(currentAss.name + ' settings', () => {

            ...fRange('Button text size', t.uiBtn||11, 9, 18, 1, v => { t.uiBtn=v; save(); applyAsSize(); }),
            ...fRange('Chip text size', t.uiChip||11, 9, 18, 1, v => { t.uiChip=v; save(); applyAsSize(); }),
            ...fRange('Switcher avatar size', t.uiSw||20, 14, 40, 1, v => { t.uiSw=v; save(); applyAsSize(); }),
            ...fRange('Face avatar size', t.uiFace||200, 80, 300, 4, v => { t.uiFace=v; save(); applyAsSize(); assistantPage(); }),
            ...fRange('Button padding Y', t.uiPadY||3, 2, 14, 1, v => { t.uiPadY=v; save(); applyAsSize(); }),

const vOn=()=>!!(vw&&vw.el&&vw.el.isConnected);
const V=()=>({dark:.55,fit:'contain',asz:56,acol:'#ffffff',ao:'1',loop:'yes',cap:'yes',strip:'yes',sec:4,fsbg:'#000000',rad:8,...(S.theme.vw||{})});
function applyV(){const v=V(),r=document.documentElement.style;
  r.setProperty('--vfit',v.fit);r.setProperty('--vasz',v.asz+'px');r.setProperty('--vacol',v.acol);r.setProperty('--vrad',v.rad+'px');r.setProperty('--vfs',v.fsbg);r.setProperty('--vao',v.ao==='1'?1:0);
  $('#vdim').style.opacity=vOn()?v.dark:0}

function stopAuto(){clearTimeout(vtm);vtm=null}
function tick(){stopAuto();if(!vOn()||!vw.play)return;vtm=setTimeout(()=>vstep(1),V().sec*1000)}
function vstep(d){
  if(!vOn())return;const n=vw.node.items.length;let i=vw.i+d;
  if(i<0||i>=n){if(V().loop==='yes')i=(i+n)%n;else{vw.play=false;vw.playBtn.textContent='▶';stopAuto();return}}
  vw.i=i;showPhoto();tick();
}
function showPhoto(){
  const items=vw.node.items,n=items.length,m=items[vw.i];
  vw.img.src=thumb(m,2000);vw.img.alt=m.n;vw.cap.textContent=`${m.n}  ·  ${vw.i+1} / ${n}`;
  if(vw.strip)[...vw.strip.children].forEach((c,k)=>{c.classList.toggle('on',k===vw.i);if(k===vw.i)vw.strip.scrollLeft=c.offsetLeft-vw.strip.clientWidth/2+c.clientWidth/2});
  [1,-1].forEach(d=>{new Image().src=thumb(items[(vw.i+d+n)%n],2000)});
  pushRecent(m);
}
const vfs=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(vOn()&&vw.el.requestFullscreen)vw.el.requestFullscreen()};

  const arr=(side,d,ch)=>items.length>1?el('button',{class:'varr',style:side+':12px','aria-label':d<0?'Previous photo':'Next photo',onclick:()=>vstep(d)},ch):null;
  const stage=el('div',{class:'vstage'},img,arr('left',-1,'‹'),arr('right',1,'›'),
    el('div',{class:'vbar'},items.length>1?playBtn:null,el('button',{title:'Full screen (F)',onclick:vfs},'⛶'),el('button',{class:'vset',title:'Photo page settings',onclick:viewerPanel},'⚙')));
  let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)vstep(dx<0?1:-1)},{passive:true});
  const strip=v.strip==='yes'&&items.length>1?el('div',{class:'vstrip'},items.map((m,k)=>el('img',{src:thumb(m,160),loading:'lazy',referrerpolicy:'no-referrer',alt:'',onclick:()=>{vw.i=k;showPhoto();tick()}}))):null;
  const w=el('div',{class:'vw'},
    el('div',{class:'ptop'},el('button',{onclick:goBack},'← Back'),el('h2',{style:`color:${f.textColor||'var(--text)'}`},f.name||node.name),styleBtn(node)),
    stage,v.cap==='yes'?cap:null,strip);
  Object.assign(vw,{el:w,img,cap,strip,playBtn});
  showPhoto();tick();
  return w;
}

document.addEventListener('keydown',e=>{

/* ---------- Video thumbnails (random frame between 0:30 and 0:45) ---------- */
const vq=[],vpend=new Set();let vrun=0;
function vthumb(m,img){
  if(S.vthumbs[m.id]){img.src=S.vthumbs[m.id];return}
  img.src=thumb(m,320);
  if(owner&&token&&!vpend.has(m.id)){img._m=m;vobs.observe(img)}
}
const vobs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;vobs.unobserve(e.target);const m=e.target._m;if(m&&!vpend.has(m.id)){vpend.add(m.id);vq.push(m);pump()}}),{rootMargin:'200px'});
function pump(){
  while(vrun<2&&vq.length){const m=vq.shift();vrun++;
    grab(m).then(d=>{if(d){S.vthumbs[m.id]=d;document.querySelectorAll('img[data-v="'+m.id+'"]').forEach(i=>i.src=d);save()}}).catch(()=>{}).finally(()=>{vrun--;pump()})}
}
function grab(m){return new Promise(res=>{
  const v=document.createElement('video');v.crossOrigin='anonymous';v.muted=true;v.preload='metadata';
  let fin=false;const done=x=>{if(fin)return;fin=true;clearTimeout(to);v.removeAttribute('src');v.load();res(x)};
  const to=setTimeout(()=>done(null),25000);
  v.onerror=()=>done(null);
  v.onloadedmetadata=()=>{const d=v.duration;if(!isFinite(d)||d<=0)return done(null);const hi=Math.min(120,d-.5);v.currentTime=hi>60?60+Math.random()*(hi-60):d/2};
  v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=240;c.height=Math.round(240*v.videoHeight/v.videoWidth)||135;c.getContext('2d').drawImage(v,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.65))}catch{done(null)}};
  v.src=`https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&access_token=${token}`;
})}

/* ---------- Lightbox ---------- */

// Plays videos right inside the page. Uses a Google sign-in token (owner) or the API key (visitors); never shows Drive's sign-in page unless you ask for it.
function wantToken(){return new Promise((res,rej)=>{
  if(!S.cid||!window.google)return rej(new Error('Google sign-in is not available'));
  google.accounts.oauth2.initTokenClient({client_id:S.cid,scope:'https://www.googleapis.com/auth/drive.readonly',
    callback:r=>{if(r.error)rej(new Error(r.error));else{setTok(r);res(token)}},error_callback:e=>rej(new Error(e&&e.type||'popup'))}).requestAccessToken({prompt:''});
})}
function videoEl(m){
  if(token&&tokExp&&Date.now()>tokExp)token=null;
  const box=el('div',{class:'vbox'});
  const frame=()=>box.replaceChildren(el('iframe',{src:`https://drive.google.com/file/d/${m.id}/preview`,allow:'autoplay;fullscreen',allowfullscreen:'',sandbox:'allow-scripts allow-same-origin'}));
  const msg=t=>box.replaceChildren(el('div',{class:'vmsg'},el('p',{},t),
    owner&&S.cid?el('button',{class:'pri',onclick:()=>wantToken().then(()=>showLb()).catch(e=>alert('Sign-in failed: '+e.message))},'Sign in to Google to play'):null,
    el('button',{onclick:frame},'Try Drive’s own player')));
  const play=()=>{
    if(!box.isConnected)return;
    const urls=[];
    if(token)urls.push(`https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&access_token=${token}`);
    if(S.apiKey)urls.push(`https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&key=${S.apiKey}`);
    urls.push(`https://drive.usercontent.google.com/download?id=${m.id}&export=download&confirm=t`);
    let k=0;const v=el('video',{controls:'',playsinline:'',preload:'auto',src:urls[0]});
    v.onerror=()=>{if(++k<urls.length){v.src=urls[k];v.play().catch(()=>{})}else msg('This video couldn’t be streamed. Make sure its folder is shared as “Anyone with the link”'+(owner?', or sign in again.':'.'))};
    box.replaceChildren(v);v.play().catch(()=>{});
  };
  // Owner without a live sign-in: quietly reconnect first (no account page is shown if you've already approved this app).
  if(owner&&!token&&S.cid&&window.google){
    box.append(el('div',{class:'vmsg'},el('p',{},'Connecting to Google…')));
    let done=false;const go=()=>{if(!done){done=true;play()}};
    const t=setTimeout(go,9000);
    wantToken().then(()=>{clearTimeout(t);go()}).catch(()=>{clearTimeout(t);go()});
  }else setTimeout(play,0);
  return box;
}
function openLb(g,i){cur=g;ci=i;showLb()}
function showLb(){
  const lb=$('#lb'),m=cur.items[ci];lb.className='on';lb.innerHTML='';pushRecent(m);
  const stage=el('div',{class:'stage'},isVid(m)?videoEl(m):el('img',{src:thumb(m,2000),referrerpolicy:'no-referrer'}));
  const bar=el('div',{class:'bar'},m.n+`  (${ci+1}/${cur.items.length})`,
    isVid(m)?null:el('a',{href:`https://drive.google.com/file/d/${m.id}/view`,target:'_blank',rel:'noopener',style:'color:#8fb0ff'},'Open in Drive'));
  if(owner&&edit&&cur.id!=='__r'){
    const cl=closeLb;
    bar.append(el('button',{onclick:()=>{setF(cur.id,'coverId',m.id);setF(cur.id,'coverImg','');cl()}},'★ Folder cover'),
      el('button',{onclick:()=>{setF(cur.id,'bgId',m.id);setF(cur.id,'bgImg','');cl()}},'🖼 Folder background'),
      el('button',{onclick:()=>{S.theme.bgId=m.id;S.theme.bgImg='';save();render();cl()}},'🏠 Page background'));
  }
  lb.append(stage,bar,el('button',{class:'nav',style:'left:10px',onclick:()=>step(-1)},'‹'),el('button',{class:'nav',style:'right:10px',onclick:()=>step(1)},'›'),
    el('button',{style:'position:absolute;top:12px;right:12px',onclick:closeLb},'✕'));
}
const step=d=>{ci=(ci+d+cur.items.length)%cur.items.length;showLb()};
document.addEventListener('keydown',e=>{if($('#lb').className!=='on')return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

function exportShare(){
  const lib={...S.lib,media:S.lib.media.map(({t,...m})=>m)};
  const blob=new Blob([JSON.stringify({theme:S.theme,folders:S.folders,vthumbs:S.vthumbs,vtv:2,apiKey:S.apiKey||'',lib})],{type:'application/json'});
  const a=el('a',{href:URL.createObjectURL(blob),download:'library.json'});a.click();
  alert('Saved library.json.\n\nPut it in the same folder as index.html on your host. Visitors see a read-only copy of your customized library.\n\nFor photos to show for them, share your top Drive folder as “Anyone with the link → Viewer”.');
}
